<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="color-scheme" content="light">

<style>
:root{--navy:#16324F;--navy2:#1d4268;--amber:#e8a33d;--line:#d7dee8;--bg:#f3f6fa;--ok:#15803d;--warn:#b45309;--ng:#b91c1c;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:#1e293b;font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1}
header .ver{font-size:10px;opacity:.6}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700;color:var(--navy)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.a{background:var(--amber);border-color:var(--amber);color:#3b2a05}
.btn.s{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:6px 10px;font-size:12px}
.wrap{display:flex;gap:14px;max-width:1280px;margin:0 auto;padding:14px;align-items:flex-start}
aside{width:210px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
aside h3{margin:0 0 8px;font-size:12px;color:#64748b}
.pl{display:flex;gap:4px;margin-bottom:6px}
.pl button.n{flex:1;text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:6px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl button.n.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pl button.x{border:none;background:none;color:#94a3b8}
main{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--navy)}
#drop{border:2px dashed #94a3b8;border-radius:12px;padding:36px 12px;text-align:center;background:#fff;color:#475569}
#drop.over{background:#eaf2fb;border-color:var(--navy)}
.note{font-size:12px;color:#64748b;line-height:1.7}
.msg{padding:8px 10px;border-radius:8px;font-size:12px;margin:6px 0;line-height:1.7}
.msg.ok{background:#ecfdf3;color:var(--ok)} .msg.warn{background:#fff7ed;color:var(--warn)} .msg.ng{background:#fef2f2;color:var(--ng)} .msg.info{background:#eff6ff;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.f label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#475569;margin-bottom:2px}
.f input[type=number],.f select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.f input.man{background:#fffbeb;border-color:var(--amber)}
.badge{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700;white-space:nowrap}
.b-text{background:#dcfce7;color:#166534}.b-ai{background:#dbeafe;color:#1e40af}.b-man{background:#fef3c7;color:#92400e}.b-none{background:#fee2e2;color:#991b1b}.b-chk{background:#e0e7ff;color:#3730a3}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table.t{border-collapse:collapse;width:100%;min-width:620px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.t th{background:#eef3f9;font-size:12px}
table.t td.r{text-align:right}
table.t input{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;font:inherit;border-radius:4px}
table.t input:focus{border-color:var(--navy);background:#fff;outline:none}
table.t input.num{text-align:right}
table.t td.ov input{background:#fffbeb;border-color:var(--amber)}
table.t tr.na td{color:var(--ng)}
table.t tr.zero td{color:#94a3b8}
.rst{border:none;background:none;color:#b45309;font-size:11px;padding:0 2px}
.tot{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;font-weight:700}
.tot .big{font-size:18px;color:var(--navy)}
.tot .big.ai{color:#1d4ed8}.tot .big.neg{color:#b91c1c}
table.t td.diff{background:#dbeafe;font-weight:700}
.hint{display:block;font-size:11px;margin-top:2px;font-weight:700}.hint.ai{color:#1d4ed8}.hint.cd{color:#7c3aed}
.logo{width:30px;height:30px;flex-shrink:0}
#pdfbox{height:420px;overflow:auto;background:#525659;border-radius:8px;padding:10px 0;text-align:center}
#pdfbox canvas{max-width:96%;background:#fff;margin:0 0 12px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
dialog{border:none;border-radius:12px;padding:16px;max-width:460px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input[type=password],dialog input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
details summary{cursor:pointer;font-weight:700;color:var(--navy)}
pre.raw{white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:8px;border-radius:6px;max-height:300px;overflow:auto}
#printArea{display:none}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:100%}.grid{grid-template-columns:repeat(2,1fr)}}
@page{size:A4;margin:12mm}
@page land{size:A4 landscape;margin:10mm}
@media print{
  #printArea .pb{break-before:page}
  #printArea .land{page:land}
  #printArea img.plan{max-width:100%;max-height:170mm;display:block;margin:0 auto}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:"Noto Sans JP","Yu Gothic",sans-serif;color:#000}
  #printArea h2{font-size:18px;margin:0 0 4px}
  #printArea .sub{font-size:13px;margin:0 0 12px}
  #printArea table{border-collapse:collapse;width:100%;font-size:12px}
  #printArea th,#printArea td{border:1px solid #000;padding:5px 6px;text-align:left}
  #printArea td.r{text-align:right}
  #printArea h3{font-size:14px;margin:8px 0 0;text-align:right}
}
</style>

<body>
<header>
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="110" fill="#e8a33d"/><path d="M96 276 256 138l160 138" fill="none" stroke="#16324F" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 252v150h220V252" fill="none" stroke="#16324F" stroke-width="34" stroke-linejoin="round"/><path d="M200 330h112M200 372h72" stroke="#16324F" stroke-width="26" stroke-linecap="round"/></svg>
  <h1>松井建設 積算システム <span class="ver" id="ver"></span></h1>

</header>
<div class="wrap">
  <aside>
    <h3>📂 解析した物件（このページを開いている間だけ）</h3>
    <div id="plist"></div>
    <button class="btn s" id="btnNew" style="width:100%;margin-top:6px">＋ 図面を追加</button>

  <main id="main"></main>
</div>

<dialog id="dlgKey">
  <h2 style="margin-top:0;font-size:15px">🔑 AIの設定（任意）</h2>
  <p class="note">AI（Gemini）は、駐車場・階段・サイクルストッパーなど、文字からは読めない項目の補助にだけ使います。図面の文字が入っているPDFは、AIなしで読み取れます。<br>キーは<b>この端末のブラウザの中だけ</b>に保存され、Google以外には送られません。</p>
  <label class="note">Gemini APIキー</label>
  <input type="password" id="keyIn" autocomplete="off" placeholder="AIza...">
  <label class="note" style="display:block;margin-top:6px"><input type="checkbox" id="keySave" checked> この端末に保存する</label>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="btn" id="keyDel">キーを消す</button><button class="btn p" id="keyOk">閉じる</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
"use strict";
const APP_VERSION="2026.11.12.3";
document.getElementById("ver").textContent="v"+APP_VERSION;

/* ================= 単価・設定（ここを書き換えれば単価が変わります） ================= */
const PRICE={CB1:6500,CB2:7000,CB3:9500,CB4:12000,CB5:15000,CP5:22000,CP6:30000,CP7:35000,
  ZANDO_G:8500,ZANDO_S:27000,SAISEKI:400,MORIDO:3500,SEICHI:45000,JUKI:35000,TENBA:600,
  GAI_MIZUMORI:45000,GAI_JUKI:35000,TILE:50000,HABAKI:60000,DOMA:9000,DOMA_PUMP:45000,KURUMA:6000,LINE:18000,
  JISAKI:4000,CYCLE:7500,GOMIBOX:7500,GOMIAREA:100000,SLIT:1500,HAISUI:12500,ENTMORTAR:35000,KAIDAN:15000,
  KISO_TSUBO:70000,SUTECON:2000,UB:30000,TESTPIECE:25000,PUMP_K:35000,ONDO:2000,
  PANEL_TSUBO:63500,TSURIGI:150000};
// RC擁壁の単価（高さ別・円/m）。これ以外の高さが図面に出たら「単価未設定」と表示します
const RC_PRICE={2000:203000,2500:275000};
const RC_STD=[2000,2500];           // 常に表示する高さ
const EXP_RATE=0.05, TAX_RATE=1.1;  // 現場諸経費5%、消費税10%
const TEST_LEGACY_RC=false;         // 試験用（旧アプリとの突き合わせ専用。通常はfalse）

/* ================= 数値ヘルパー ================= */
const rnd2=x=>Number((+x||0).toFixed(2));
const yen=n=>"¥"+Math.trunc(n).toLocaleString("ja-JP");
const fmtQ=n=>{n=+n||0;return Number.isInteger(n)?String(n):String(rnd2(n));};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s).normalize("NFKC").replace(/\s+/g,"");

/* ================= 読み取り項目 ================= */
// {k:キー, l:表示名, u:単位, ai:1=文字から読みにくい項目, flag:1=有り/無し}
const FIELDS=[
 {k:"S_AREA",l:"敷地面積",u:"㎡"},{k:"B_AREA",l:"建築面積",u:"㎡"},{k:"TOTAL_AREA",l:"延床面積",u:"㎡"},
 {k:"F_DEEP_VAL",l:"深基礎費用",u:"万円"},{k:"MORIDO",l:"盛土",u:"m³"},{k:"ZANDO",l:"残土処分",u:"m³"},
 {k:"CB1",l:"CB1段",u:"m"},{k:"CB2",l:"CB2段",u:"m"},{k:"CB3",l:"CB3段",u:"m"},{k:"CB4",l:"CB4段",u:"m"},{k:"CB5",l:"CB5段",u:"m"},
 {k:"CP5",l:"CP5段",u:"m"},{k:"CP6",l:"CP6段",u:"m"},{k:"CP7",l:"CP7段",u:"m"},
 {k:"P_TOTAL",l:"駐車場台数",u:"台",ai:1},{k:"BIKES",l:"自転車の台数",u:"台",ai:1,note:"3台で1台"},{k:"C_UNIT",l:"サイクルストッパー設置数",u:"台",ai:1},
 {k:"STAIRS",l:"階段施工 段数",u:"段",ai:1},{k:"JISAKI",l:"地先ブロック",u:"m",ai:1},
 {k:"GOMI_BOX",l:"ゴミボックス",u:"",flag:1},{k:"GOMI_AREA",l:"ゴミ集積所",u:"",flag:1}
];
const AI_ALWAYS=["P_TOTAL","JISAKI"];   // AIが読めば常に精密側へ反映する項目
const CBKEYS=["CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7"];

/* ================= 図面の文字の取り出し ================= */
async function extractFromPdf(doc){
  const items=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent();
    tc.items.forEach(i=>{ if(i.str&&i.str.trim()) items.push({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,p,W:vp.width,H:vp.height}); });
  }
  const res=parseItems(items);
  // AIに渡す文字データ（左上を原点とした0〜1000の座標つき）。大きすぎないよう2ページ・約6万文字まで
  let dg="";
  [...items].filter(i=>i.p<=2).sort((a,b)=>a.p-b.p||b.y-a.y||a.x-b.x).forEach(i=>{
    if(dg.length<60000) dg+=`${i.p}|${Math.round(i.x/i.W*1000)},${Math.round((i.H-i.y)/i.H*1000)}|${i.s.trim()}\n`; });
  res.digest=dg;
  return res;
}
function parseItems(items){
  const res={vals:{},src:{},raw:{RC:[]},cand:{},textChars:items.reduce((a,i)=>a+i.s.length,0)};
  const set=(k,v)=>{res.vals[k]=v;res.src[k]="text";};
  if(res.textChars<80){ res.noText=true; return res; }
  // 行にまとめて文字列にする（同じ高さ・左から右）。大きな隙間は「¦」で区切る
  const sorted=[...items].sort((a,b)=>a.p-b.p||b.y-a.y||a.x-b.x);
  const rows=[];
  sorted.forEach(i=>{ const r=rows.find(r=>r.p===i.p&&Math.abs(r.y-i.y)<=3); if(r)r.it.push(i); else rows.push({p:i.p,y:i.y,it:[i]}); });
  const rowStr=r=>{ r.it.sort((a,b)=>a.x-b.x); let s="",px=null; r.it.forEach(i=>{ if(px!==null&&i.x-px>25)s+="¦"; s+=nz(i.s); px=i.x+(i.w||i.s.length*5); }); return s; };
  const all=rows.map(rowStr).join("\n");
  const flat=all.replace(/¦/g,"");   // 文字の隙間の記号を除いた版（「残土処 分」のような分割に対応）
  const rv=re=>{const m=flat.match(re);return m?parseFloat(m[1].replace(/,/g,"")):null;};
  // 面積：ラベルの右隣の数字（なければ文字列から）
  const rowVal=label=>{
    const l=items.find(i=>{const t=nz(i.s);return t===label||t===label+"："||t===label+":";});
    if(l){ const c=items.filter(i=>i.p===l.p&&Math.abs(i.y-l.y)<3&&i.x>l.x&&/^[\d.,]+$/.test(i.s.trim())).sort((a,b)=>a.x-b.x)[0]; if(c) return rnd2(parseFloat(c.s.replace(/,/g,""))); }
    return null;
  };
  let v;
  if((v=rowVal("敷地面積"))!==null||(v=rv(/敷地面積[:：]([\d.,]+)㎡/))!==null) set("S_AREA",v);
  if((v=rowVal("建築面積"))!==null||(v=rv(/建築面積[:：]([\d.,]+)㎡/))!==null) set("B_AREA",v);
  if((v=rowVal("延床面積"))!==null||(v=rv(/(?<!用)延床面積[:：]([\d.,]+)㎡/))!==null) set("TOTAL_AREA",v);
  if((v=rv(/深基礎費用[:：]?([\d.,]+)万/))!==null) set("F_DEEP_VAL",v);
  if((v=rv(/盛土[:：]([\d.,]+)m/))!==null) set("MORIDO",v);
  if((v=rv(/残土処分[:：]([\d.,]+)m/))!==null) set("ZANDO",v);
  // CB・CP（段数と長さ。同じ段数が複数あれば合算）
  const sum={};
  for(const m of flat.matchAll(/(CB|CP)([1-7])段(?:積)?(?:\(t=?\d+\))?[:：]([\d.]+)m/g)){ const k=m[1]+m[2]; sum[k]=(sum[k]||0)+parseFloat(m[3]); }
  Object.keys(sum).forEach(k=>set(k,rnd2(sum[k])));
  // RC擁壁（高さ別）
  const rc={};
  for(const m of flat.matchAll(/RC擁壁\(t=?(\d+)[、,，]?H(\d+)\)[:：]([\d.]+)m/g)){ rc[m[2]]=(rc[m[2]]||0)+parseFloat(m[3]); }
  res.raw.RC=Object.keys(rc).map(h=>({H:+h,L:rnd2(rc[h])}));
  if(res.raw.RC.length) res.src.RC="text";
  // 凡例：●（有り）／○（無し）。項目名の左にある記号を見る
  const marks=items.filter(i=>/^[●○〇]$/.test(i.s.trim()));
  const legend=name=>{
    const lab=items.find(i=>nz(i.s).startsWith(name)); if(!lab) return null;
    const c=marks.filter(m=>m.p===lab.p&&Math.abs(m.y-lab.y)<3&&m.x<lab.x&&lab.x-m.x<40).sort((a,b)=>b.x-a.x)[0];
    return c?(c.s.trim()==="●"?1:0):null;
  };
  const gb=legend("ゴミボックス"); if(gb!==null) set("GOMI_BOX",gb);
  const ga=legend("ゴミ集積所"); if(ga!==null) set("GOMI_AREA",ga);
  const cy=legend("サイクルストッパ");
  if(cy!==null){
    if(cy===0) set("C_UNIT",0);
    else { const n=(all.match(/サイクルストッパー\d{3,}/g)||[]).length; if(n>0) set("C_UNIT",n); }
  }
  // 「※CB2段(t120)：58m」のような記載一覧がある図面だけ、書かれていない項目を0(=無し)にする。
  const hasNotes=["MORIDO","ZANDO","CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7"].some(k=>res.vals[k]!==undefined)||res.raw.RC.length>0;
  if(hasNotes){ ["MORIDO","ZANDO","CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7"].forEach(k=>{ if(res.vals[k]===undefined){res.vals[k]=0;res.src[k]="text0";} }); }
  // 記載一覧がない図面：「新設CB2段積」の近くにある「隣地境界線 19,660」などの寸法から長さを推定（あくまで候補）
  if(!hasNotes){
    const seen={};
    rows.forEach(r=>{
      const m=rowStr(r).replace(/¦/g,"").match(/新設(CB|CP)([1-7])段/); if(!m) return;
      const key=m[1]+m[2], lx=Math.min(...r.it.map(i=>i.x));
      const near=rows.filter(o=>o!==r&&o.p===r.p&&Math.abs(o.y-r.y)<=20&&/境界線/.test(o.it.map(i=>nz(i.s)).join(""))).sort((a,b)=>Math.abs(a.y-r.y)-Math.abs(b.y-r.y));
      for(const o of near){
        const lab=o.it.find(i=>/境界線/.test(nz(i.s)));
        const num=o.it.filter(i=>i.x>=lab.x&&/^\d{1,3}(,\d{3})+$|^\d{4,6}$/.test(i.s.trim())).sort((a,b)=>a.x-b.x)[0];
        if(num){ const mm=parseFloat(num.s.replace(/,/g,"")); if(mm>=1000){ const L=rnd2(mm/1000); seen[key]=seen[key]||new Set(); seen[key].add(L); } break; }
      }
    });
    Object.keys(seen).forEach(k=>{ res.cand[k]=rnd2([...seen[k]].reduce((a,b)=>a+b,0)); });
  }
  // ゴミ集積所：凡例に記号がなくても、配置図の中に「ごみ集積所」と書かれた囲いがあれば「有り」
  if(res.vals.GOMI_AREA===undefined){
    const plan=items.filter(i=>/^(ごみ|ゴミ)集積所$/.test(nz(i.s))&&!marks.some(m=>m.p===i.p&&Math.abs(m.y-i.y)<3&&m.x<i.x&&i.x-m.x<40));
    if(plan.length) set("GOMI_AREA",1);
  }
  // 階段：「+90」「+250」「+410」のような高さ表示が約160mmずつ並んでいれば階段。いちばん低い表示は地盤(GL)なので、段数＝個数−1
  const lv=items.map(i=>({t:nz(i.s),x:i.x,y:i.y,p:i.p})).filter(o=>/^\+\d{2,4}$/.test(o.t)).map(o=>({...o,v:parseInt(o.t.slice(1))}));
  let live=[...lv], stairs=0, chains=[];
  for(;;){
    const n=live.length; if(n<3) break;
    live.sort((a,b)=>a.v-b.v);
    const len=new Array(n).fill(1), prv=new Array(n).fill(-1);
    for(let j=0;j<n;j++) for(let i=0;i<j;i++){ const d=live[j].v-live[i].v;
      if(live[j].p===live[i].p&&d>=120&&d<=200&&Math.hypot(live[j].x-live[i].x,live[j].y-live[i].y)<220&&len[i]+1>len[j]){len[j]=len[i]+1;prv[j]=i;} }
    let b=0; for(let j=1;j<n;j++) if(len[j]>len[b]) b=j;
    if(len[b]<3) break;
    const ids=[]; for(let j=b;j>=0;j=prv[j]) ids.push(j);
    chains.push(ids.map(j=>live[j].v).reverse()); stairs+=len[b]-1;
    live=live.filter((_,j)=>!ids.includes(j));
  }
  if(stairs>0){ res.cand.STAIRS=stairs; res.stairChains=chains; }
  return res;
}

// 手入力の上書きを反映し、諸経費・金額を計算
function calc(S,key,mode){
  const base=(mode==="ai"&&S.pv?buildRows(S.pv.P,S.pv.rc):buildRows(S.vals,S.rc))[key], ov=(S.ov[key]||{});
  const rows=base.map(r=>{ const o=ov[r.id]||{}; const x={...r}; ["name","qty","unit","price"].forEach(f=>{ if(!r.exp&&o[f]!==undefined) x[f]=o[f]; }); x.ov=o; return x; });
  const sub=rows.filter(r=>!r.exp).reduce((a,r)=>a+r.qty*r.price,0);
  rows.forEach(r=>{ if(r.exp) r.price=Math.trunc(sub*EXP_RATE); r.amount=Math.trunc(r.qty*r.price); });
  const ex=rows.reduce((a,r)=>a+r.amount,0);
  return {rows,ex,inc:Math.trunc(ex*TAX_RATE)};
}

  if(/pdf/i.test(S.mime)||/\.pdf$/i.test(file.name)){

const KEYLABEL={S_AREA:"敷地面積(㎡)",B_AREA:"建築面積(㎡)",TOTAL_AREA:"延床面積(㎡)",F_DEEP_VAL:"深基礎費用(万円)",MORIDO:"盛土(m3)",ZANDO:"残土処分(m3)",
  CB1:"CB1段の長さ(m)",CB2:"CB2段の長さ(m)",CB3:"CB3段の長さ(m)",CB4:"CB4段の長さ(m)",CB5:"CB5段の長さ(m)",CP5:"CP5段の長さ(m)",CP6:"CP6段の長さ(m)",CP7:"CP7段の長さ(m)",
  GOMI_BOX:"ゴミボックス(有=1/無=0)",GOMI_AREA:"ゴミ集積所(有=1/無=0)"};
function buildPrompt(S){
  const need=Object.keys(KEYLABEL).filter(k=>!(S.src[k]==="text"||S.src[k]==="text0"||S.src[k]==="man"));
  const lines=[
   "あなたは経験豊富な積算士です。添付の配置図の画像（と、図面内の文字データ）から、次の項目を読み取ってください。",
   "文字データは「ページ|横,縦(0〜1000・左上が原点)|文字」の形式です。寸法の数字や注記は、文字データの方が画像より正確です。画像は位置関係・記号の数え上げに使ってください。",
   "",
   "【必ず読み取る項目】",
   "P_TOTAL: 駐車場の台数。凡例で「普通自動車P」「軽自動車P」が白丸(○)なら0。黒丸(●)のものは図面の台数表記や駐車枠を数える。",
   "STAIRS: 階段の段数。階段の各ステップに「+250」「+410」のような高さ表示（四角い囲み）が付く。最も低い表示（例：+90）は地盤(GL)で段に数えない。例：+90,+250,+410,+570 の4つなら3段。+100,+255,+410,+565,+720 の5つなら4段。図面内に階段が複数あれば合計する。無ければ0。",
   "JISAKI: 地先ブロックの総延長(m)。無ければ0。",
   "BIKES: サイクルストッパーが凡例で黒丸(●)のとき、図面内の駐輪スペース（自転車を停める記号の並び）が何台分あるか。記号を1つずつ数えること。白丸(○)なら0。",
   "C_LABEL: 「サイクルストッパー2400」のような名称＋寸法の文字ラベルの個数。",
   "RC2000 / RC2500: RC擁壁の高さ別の延長(m)。H2000の長さ、H2500の長さ。無ければ0。",
  ];
  if(need.length){ lines.push("","【文字データから読み取れなかった項目（図面にあれば読み取る。無ければ0）】");
    need.forEach(k=>lines.push(k+": "+KEYLABEL[k]));
    if(need.some(k=>CBKEYS.includes(k))) lines.push("※CB◯段・CP◯段は、「※CB2段(t120)：58m」のような注記があればその数値。注記が無い図面では、「新設CB2段積」と書かれた線に沿った寸法線の数値（mmをmに換算）から人間が積算するように長さを求める。「CB2段」なら必ずCB2に入れる（段数の数字とキーの数字を一致させる）。",
      "※境界線の寸法が複数に分かれていれば合計する。同じ線を図面内で二重に数えないこと。");
  }
  lines.push("","【出力形式・厳守】",

   "2) 見出し「###RESULT###」の下に、最終結果だけを `キー:数値` をカンマで区切って1行で出力する。数値以外の文字は入れない。",
   "   例: P_TOTAL:2, STAIRS:5, JISAKI:0, BIKES:6, C_LABEL:0, RC2000:0, RC2500:0"+(need.length?", "+need.slice(0,3).map(k=>k+":0").join(", ")+" …":""));

const BAD_MODEL=/(tts|image|embed|live|audio|vision|robotics|computer|learnlm|aqa|imagen|veo|gemma|thinking-exp|exp-|omni|customtools|native)/i;
function modelRank(n){
  const pre=/preview|exp|latest/i.test(n)?1:0, fam=/flash/i.test(n)?(/lite/i.test(n)?2:0):(/pro/i.test(n)?1:3);
  const ver=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])||0;
  return [pre,fam,-ver];
}
async function modelCandidates(key){
  const fallback=["models/gemini-2.5-flash","models/gemini-2.5-pro"];
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    if(r.ok){ const j=await r.json();
      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name).filter(n=>/gemini/i.test(n)&&!BAD_MODEL.test(n));
      names.sort((a,b)=>{const x=modelRank(a),y=modelRank(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||a.localeCompare(b);});
      if(names.length) return names; }
  }catch(e){}
  return fallback;
}
function b64(bytes){ let s="";const CH=0x8000; for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH)); return btoa(s); }
// 図面を長辺2800px程度のJPEGにして送る（PDFを丸ごと送るより軽くて速い）
async function imagesForAI(S){
  if(!S.pdfDoc) return [{mime:S.mime,data:b64(S.bytes)}];
  const out=[], n=Math.min(S.pdfDoc.numPages,2);
  for(let p=1;p<=n;p++){
    const pg=await S.pdfDoc.getPage(p), v1=pg.getViewport({scale:1}), sc=2800/Math.max(v1.width,v1.height), vp=pg.getViewport({scale:sc});
    const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    out.push({mime:"image/jpeg",data:c.toDataURL("image/jpeg",0.88).split(",")[1]});
  }
  return out;
}
// 結果を少しずつ受け取る（ストリーム）。60秒間まったく届かなければ中断して次のモデルへ
async function streamOne(key,m,body,st){
  const ac=new AbortController(); let idle; const arm=()=>{clearTimeout(idle);idle=setTimeout(()=>ac.abort(),60000);}; arm();
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/${m}:streamGenerateContent?alt=sse`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body,signal:ac.signal});
    if(!r.ok){ const tx=(await r.text()).slice(0,200); const e=new Error(tx); e.status=r.status; throw e; }
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf="",text="";
    for(;;){ const {done,value}=await rd.read(); if(done) break; arm(); buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf("\n"))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(line.startsWith("data:")){ try{ const j=JSON.parse(line.slice(5)); const pr=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts; if(pr) text+=pr.map(p=>p.text||"").join(""); }catch(e){} } }
      st(`${m.replace("models/","")} で読み取り中… 受信 ${text.length} 文字`); }
    return text;
  }catch(e){ if(e.name==="AbortError"){ const x=new Error("60秒間応答なし"); x.timeout=true; throw x; } throw e; }
  finally{ clearTimeout(idle); }
}
async function callGemini(key,parts,st){
  st=st||(()=>{});
  const cands=(await modelCandidates(key)).slice(0,6), body=JSON.stringify({contents:[{parts}],generationConfig:{temperature:0}});
  let errs=[],quota=0,net=0;
  for(const m of cands){
    const nm=m.replace("models/","");
    st(`${nm} に送信中…`);
    try{ const t=await streamOne(key,m,body,st); if(t&&t.trim()) return t; errs.push(nm+" → 空の応答"); }
    catch(e){
      if(e.timeout){ errs.push(nm+" → 60秒間応答なし"); continue; }
      if(e.status===429){ quota++; errs.push(nm+" → 利用上限"); continue; }
      if([400,404,500,503].includes(e.status)){ errs.push(nm+" → "+e.status); continue; }
      if(e.status) throw new Error(`HTTP ${e.status}: ${e.message}`);
      net++; errs.push(nm+" → 通信失敗"); await new Promise(r=>setTimeout(r,1500));
    }
  }
  if(net&&net===errs.length) throw new Error("📶 通信が不安定です。電波の良い場所でもう一度お試しください");
  if(quota&&quota===errs.length) throw new Error("Geminiの利用上限（無料枠の回数・容量）に達しています。数分〜翌日まで待つか、Google AI Studioで課金設定（有料プラン）をしてください。試したモデル："+errs.join("、"));
  throw new Error("すべてのモデルで失敗しました（"+errs.join("、")+"）");
}
const AI_KEYS=["S_AREA","B_AREA","TOTAL_AREA","F_DEEP_VAL","MORIDO","ZANDO","CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7","P_TOTAL","STAIRS","JISAKI","BIKES","C_LABEL","RC2000","RC2500","GOMI_BOX","GOMI_AREA"];
function parseAI(text){
  const rt=text.includes("###RESULT###")?text.split("###RESULT###").pop():text, out={};
  AI_KEYS.forEach(k=>{ const m=rt.match(new RegExp("(?:^|[^A-Z_0-9])"+k+"\\s*[:：]\\s*([\\d.]+)")); if(m) out[k]=rnd2(parseFloat(m[1])); });
  return out;
}
// 精密側の値＝クイックの値に、AIの読み取りと寸法からの推定を足したもの
function computePV(S){
  const aiv=S.aiv||{}, cand=S.cand||{}, P={...S.vals}, notes=[], srcP={};
  const lab=Object.fromEntries(FIELDS.map(f=>[f.k,f.l]));
  FIELDS.forEach(f=>{
    const k=f.k, cur=S.src[k];
    if(cur==="man") return;
    const a=aiv[k], c=cand[k];
    if(a!==undefined&&(AI_ALWAYS.includes(k)||cur==="none"||cur===undefined)){
      P[k]=k.startsWith("GOMI_")?(a>0?1:0):a; srcP[k]="ai";
      if(c!==undefined&&Math.abs(c-a)>0.05) notes.push(`${lab[k]}：AI=${fmtQ(a)} ／ 寸法から推定=${fmtQ(c)}`);
    } else if(c!==undefined&&cur==="none"){ P[k]=c; srcP[k]="cand"; }
    else if(a!==undefined&&(cur==="text"||cur==="text0"||cur==="est")&&!k.startsWith("GOMI_")&&Math.abs((+S.vals[k]||0)-a)>0.005) notes.push(`${lab[k]}：文字=${fmtQ(S.vals[k])} ／ AI=${fmtQ(a)}（文字を優先）`);
  });
  // サイクルストッパー：自転車3台につき1台（自転車の台数が分かればそちらを優先）
  if(S.src.C_UNIT!=="man"){
    const b=S.src.BIKES==="man"?+S.vals.BIKES:aiv.BIKES;
    if(b>0){ P.C_UNIT=Math.ceil(b/3); P.BIKES=b; srcP.C_UNIT="ai"; srcP.BIKES=S.src.BIKES==="man"?"man":"ai"; }
    else if(aiv.C_LABEL>0&&(S.src.C_UNIT==="none")){ P.C_UNIT=aiv.C_LABEL; srcP.C_UNIT="ai"; }
  }
  let rcP=S.rc.map(r=>({...r}));
  if(S.src.RC==="none"&&(aiv.RC2000>0||aiv.RC2500>0)){ rcP=[]; if(aiv.RC2000>0)rcP.push({H:2000,L:aiv.RC2000}); if(aiv.RC2500>0)rcP.push({H:2500,L:aiv.RC2500}); }
  S.pv={P,rc:rcP,src:srcP}; S.aiDiff=notes;
}
async function runAI(){
  const S=DB[CUR], key=getKey();
  if(!key){ S.aiMsg="⚠️ AIのキーが未設定です。右上の「🔑 AIの設定」から入力してください（使わない場合は、手入力でも見積は出せます）。"; render(); return; }
  S.busy="図面を画像にしています…"; S.aiMsg=""; render();
  const stt=m=>{S.busy="🤖 "+m;const e=document.getElementById("aistat");if(e&&DB[CUR]===S)e.textContent=S.busy;};
  try{
    const imgs=await imagesForAI(S);
    const parts=[{text:buildPrompt(S)+(S.digest?"\n\n【図面内の文字データ】\n"+S.digest:"")}].concat(imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}})));
    const t=await callGemini(key,parts,stt); S.aiRaw=t; S.aiv=parseAI(t);
    S.aiMsg="✅ AI精密積算が終わりました。下の見積に「AI精密」の列が追加されています。差のある項目は色が付きます。";
  }catch(e){ S.aiMsg="⚠️ AIの読み取りに失敗しました："+e.message; }
  if(S.aiv||Object.keys(S.cand||{}).length) computePV(S);
  S.busy=""; S.aiDoneAt=Date.now(); render();
}
