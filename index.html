<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松井建設 積算システム</title>
<meta name="color-scheme" content="light">
<style>
:root{--navy:#16324F;--navy2:#1d4268;--amber:#e8a33d;--line:#d7dee8;--bg:#f3f6fa;--ok:#15803d;--warn:#b45309;--ng:#b91c1c;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:#1e293b;font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1}
header .ver{font-size:10px;opacity:.6}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700;color:var(--navy)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.a{background:var(--amber);border-color:var(--amber);color:#3b2a05}
.btn.s{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:6px 10px;font-size:12px}
.wrap{display:flex;gap:14px;max-width:1280px;margin:0 auto;padding:14px;align-items:flex-start}
aside{width:210px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
aside h3{margin:0 0 8px;font-size:12px;color:#64748b}
.pl{display:flex;gap:4px;margin-bottom:6px}
.pl button.n{flex:1;text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:6px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl button.n.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pl button.x{border:none;background:none;color:#94a3b8}
main{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--navy)}
#drop{border:2px dashed #94a3b8;border-radius:12px;padding:36px 12px;text-align:center;background:#fff;color:#475569}
#drop.over{background:#eaf2fb;border-color:var(--navy)}
.note{font-size:12px;color:#64748b;line-height:1.7}
.msg{padding:8px 10px;border-radius:8px;font-size:12px;margin:6px 0;line-height:1.7}
.msg.ok{background:#ecfdf3;color:var(--ok)} .msg.warn{background:#fff7ed;color:var(--warn)} .msg.ng{background:#fef2f2;color:var(--ng)} .msg.info{background:#eff6ff;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.f label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#475569;margin-bottom:2px}
.f input[type=number],.f select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.f input.man{background:#fffbeb;border-color:var(--amber)}
.badge{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700;white-space:nowrap}
.b-text{background:#dcfce7;color:#166534}.b-ai{background:#dbeafe;color:#1e40af}.b-man{background:#fef3c7;color:#92400e}.b-none{background:#fee2e2;color:#991b1b}.b-chk{background:#e0e7ff;color:#3730a3}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table.t{border-collapse:collapse;width:100%;min-width:620px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.t th{background:#eef3f9;font-size:12px}
table.t td.r{text-align:right}
table.t input{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;font:inherit;border-radius:4px}
table.t input:focus{border-color:var(--navy);background:#fff;outline:none}
table.t input.num{text-align:right}
table.t td.ov input{background:#fffbeb;border-color:var(--amber)}
table.t tr.na td{color:var(--ng)}
table.t tr.zero td{color:#94a3b8}
.rst{border:none;background:none;color:#b45309;font-size:11px;padding:0 2px}
.tot{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;font-weight:700}
.tot .big{font-size:18px;color:var(--navy)}
#pdfbox{height:420px;overflow:auto;background:#525659;border-radius:8px;padding:10px 0;text-align:center}
#pdfbox canvas{max-width:96%;background:#fff;margin:0 0 12px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
dialog{border:none;border-radius:12px;padding:16px;max-width:460px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input[type=password],dialog input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
details summary{cursor:pointer;font-weight:700;color:var(--navy)}
pre.raw{white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:8px;border-radius:6px;max-height:300px;overflow:auto}
#printArea{display:none}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:100%}.grid{grid-template-columns:repeat(2,1fr)}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:"Noto Sans JP","Yu Gothic",sans-serif;color:#000}
  #printArea h2{font-size:18px;margin:0 0 4px}
  #printArea .sub{font-size:13px;margin:0 0 12px}
  #printArea table{border-collapse:collapse;width:100%;font-size:12px}
  #printArea th,#printArea td{border:1px solid #000;padding:5px 6px;text-align:left}
  #printArea td.r{text-align:right}
  #printArea h3{font-size:14px;margin:8px 0 0;text-align:right}
}
</style>
</head>
<body>
<header>
  <h1>🏗️ 松井建設 積算システム <span class="ver" id="ver"></span></h1>
  <button class="btn" id="btnKey">🔑 AIの設定</button>
</header>
<div class="wrap">
  <aside>
    <h3>📂 解析した物件（このページを開いている間だけ）</h3>
    <div id="plist"></div>
    <button class="btn s" id="btnNew" style="width:100%;margin-top:6px">＋ 図面を追加</button>
  </aside>
  <main id="main"></main>
</div>
<div id="printArea"></div>

<dialog id="dlgKey">
  <h2 style="margin-top:0;font-size:15px">🔑 AIの設定（任意）</h2>
  <p class="note">AI（Gemini）は、駐車場・階段・サイクルストッパーなど、文字からは読めない項目の補助にだけ使います。図面の文字が入っているPDFは、AIなしで読み取れます。<br>キーは<b>この端末のブラウザの中だけ</b>に保存され、Google以外には送られません。</p>
  <label class="note">Gemini APIキー</label>
  <input type="password" id="keyIn" autocomplete="off" placeholder="AIza...">
  <label class="note" style="display:block;margin-top:6px"><input type="checkbox" id="keySave" checked> この端末に保存する</label>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="btn" id="keyDel">キーを消す</button><button class="btn p" id="keyOk">閉じる</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
"use strict";
const APP_VERSION="2026.11.11.3";
document.getElementById("ver").textContent="v"+APP_VERSION;

/* ================= 単価・設定（ここを書き換えれば単価が変わります） ================= */
const PRICE={CB1:6500,CB2:7000,CB3:9500,CB4:12000,CB5:15000,CP5:22000,CP6:30000,CP7:35000,
  ZANDO_G:8500,ZANDO_S:27000,SAISEKI:400,MORIDO:3500,SEICHI:45000,JUKI:35000,TENBA:600,
  GAI_MIZUMORI:45000,GAI_JUKI:35000,TILE:50000,HABAKI:60000,DOMA:9000,DOMA_PUMP:45000,KURUMA:6000,LINE:18000,
  JISAKI:4000,CYCLE:7500,GOMIBOX:7500,GOMIAREA:100000,SLIT:1500,HAISUI:12500,ENTMORTAR:35000,KAIDAN:15000,
  KISO_TSUBO:70000,SUTECON:2000,UB:30000,TESTPIECE:25000,PUMP_K:35000,ONDO:2000,
  PANEL_TSUBO:63500,TSURIGI:150000};
// RC擁壁の単価（高さ別・円/m）。これ以外の高さが図面に出たら「単価未設定」と表示します
const RC_PRICE={2000:203000,2500:275000};
const RC_STD=[2000,2500];           // 常に表示する高さ
const EXP_RATE=0.05, TAX_RATE=1.1;  // 現場諸経費5%、消費税10%
const TEST_LEGACY_RC=false;         // 試験用（旧アプリとの突き合わせ専用。通常はfalse）

/* ================= 数値ヘルパー ================= */
const rnd2=x=>Number((+x||0).toFixed(2));
const yen=n=>"¥"+Math.trunc(n).toLocaleString("ja-JP");
const fmtQ=n=>{n=+n||0;return Number.isInteger(n)?String(n):String(rnd2(n));};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s).normalize("NFKC").replace(/\s+/g,"");

/* ================= 読み取り項目 ================= */
// {k:キー, l:表示名, u:単位, t:'text'|'ai'}  text=文字から読める / ai=AIか手入力が必要
const FIELDS=[
 {k:"S_AREA",l:"敷地面積",u:"㎡"},{k:"B_AREA",l:"建築面積",u:"㎡"},{k:"TOTAL_AREA",l:"延床面積",u:"㎡"},
 {k:"F_DEEP_VAL",l:"深基礎費用",u:"万円"},{k:"MORIDO",l:"盛土",u:"m³"},{k:"ZANDO",l:"残土処分",u:"m³"},
 {k:"CB1",l:"CB1段",u:"m"},{k:"CB2",l:"CB2段",u:"m"},{k:"CB3",l:"CB3段",u:"m"},{k:"CB4",l:"CB4段",u:"m"},{k:"CB5",l:"CB5段",u:"m"},
 {k:"CP5",l:"CP5段",u:"m"},{k:"CP6",l:"CP6段",u:"m"},{k:"CP7",l:"CP7段",u:"m"},
 {k:"P_TOTAL",l:"駐車場台数",u:"台",ai:1},{k:"C_UNIT",l:"サイクルストッパー設置数",u:"箇所",ai:1},
 {k:"STAIRS",l:"階段施工 段数",u:"段",ai:1},{k:"JISAKI",l:"地先ブロック",u:"m",ai:1},
 {k:"GOMI_BOX",l:"ゴミボックス",u:"",flag:1},{k:"GOMI_AREA",l:"ゴミ集積所",u:"",flag:1}
];
const AI_ALWAYS=["P_TOTAL","C_UNIT","STAIRS","JISAKI"];   // AIが読めば常に反映する項目

/* ================= 図面の文字の取り出し ================= */
async function extractFromPdf(doc){
  const items=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p), tc=await pg.getTextContent();
    tc.items.forEach(i=>{ if(i.str&&i.str.trim()) items.push({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,p}); });
  }
  return parseItems(items);
}
function parseItems(items){
  const res={vals:{},src:{},raw:{RC:[]},textChars:items.reduce((a,i)=>a+i.s.length,0)};
  const set=(k,v)=>{res.vals[k]=v;res.src[k]="text";};
  if(res.textChars<80){ res.noText=true; return res; }
  // 行にまとめて文字列にする（同じ高さ・左から右）。大きな隙間は「¦」で区切る
  const sorted=[...items].sort((a,b)=>a.p-b.p||b.y-a.y||a.x-b.x);
  const rows=[];
  sorted.forEach(i=>{ const r=rows.find(r=>r.p===i.p&&Math.abs(r.y-i.y)<=3); if(r)r.it.push(i); else rows.push({p:i.p,y:i.y,it:[i]}); });
  const rowStr=r=>{ r.it.sort((a,b)=>a.x-b.x); let s="",px=null; r.it.forEach(i=>{ if(px!==null&&i.x-px>25)s+="¦"; s+=nz(i.s); px=i.x+(i.w||i.s.length*5); }); return s; };
  const all=rows.map(rowStr).join("\n");
  const flat=all.replace(/¦/g,"");   // 文字の隙間の記号を除いた版（「残土処 分」のような分割に対応）
  const rv=re=>{const m=flat.match(re);return m?parseFloat(m[1].replace(/,/g,"")):null;};
  // 面積：ラベルの右隣の数字（なければ文字列から）
  const rowVal=label=>{
    const l=items.find(i=>{const t=nz(i.s);return t===label+"："||t===label+":";});
    if(l){ const c=items.filter(i=>i.p===l.p&&Math.abs(i.y-l.y)<3&&i.x>l.x&&/^[\d.,]+$/.test(i.s.trim())).sort((a,b)=>a.x-b.x)[0]; if(c) return parseFloat(c.s.replace(/,/g,"")); }
    return null;
  };
  let v;
  if((v=rowVal("敷地面積"))!==null||(v=rv(/敷地面積[:：]([\d.,]+)㎡/))!==null) set("S_AREA",v);
  if((v=rowVal("建築面積"))!==null||(v=rv(/建築面積[:：]([\d.,]+)㎡/))!==null) set("B_AREA",v);
  if((v=rowVal("延床面積"))!==null||(v=rv(/(?<!用)延床面積[:：]([\d.,]+)㎡/))!==null) set("TOTAL_AREA",v);
  if((v=rv(/深基礎費用[:：]([\d.,]+)万円/))!==null) set("F_DEEP_VAL",v);
  // 「※」で始まる行：盛土・残土処分
  if((v=rv(/盛土[:：]([\d.,]+)m/))!==null) set("MORIDO",v);
  if((v=rv(/残土処分[:：]([\d.,]+)m/))!==null) set("ZANDO",v);
  // CB・CP（段数と長さ。同じ段数が複数あれば合算）
  const sum={};
  for(const m of flat.matchAll(/(CB|CP)([1-7])段(?:積)?\(t=\d+\)[:：]([\d.]+)m/g)){ const k=m[1]+m[2]; sum[k]=(sum[k]||0)+parseFloat(m[3]); }
  Object.keys(sum).forEach(k=>set(k,rnd2(sum[k])));
  // RC擁壁（高さ別）
  const rc={};
  for(const m of flat.matchAll(/RC擁壁\(t=(\d+)[、,，]H(\d+)\)[:：]([\d.]+)m/g)){ rc[m[2]]=(rc[m[2]]||0)+parseFloat(m[3]); }
  res.raw.RC=Object.keys(rc).map(h=>({H:+h,L:rnd2(rc[h])}));
  if(res.raw.RC.length) res.src.RC="text";
  // 凡例：●（有り）／○（無し）。項目名の左にある記号を見る
  const marks=items.filter(i=>/^[●○〇]$/.test(i.s.trim()));
  const legend=name=>{
    const lab=items.find(i=>nz(i.s).startsWith(name)); if(!lab) return null;
    const c=marks.filter(m=>m.p===lab.p&&Math.abs(m.y-lab.y)<3&&m.x<lab.x&&lab.x-m.x<40).sort((a,b)=>b.x-a.x)[0];
    return c?(c.s.trim()==="●"?1:0):null;
  };
  const gb=legend("ゴミボックス"); if(gb!==null) set("GOMI_BOX",gb);
  const ga=legend("ゴミ集積所"); if(ga!==null) set("GOMI_AREA",ga);
  const cy=legend("サイクルストッパ");
  if(cy!==null){
    if(cy===0) set("C_UNIT",0);
    else { const n=(all.match(/サイクルストッパー\d{3,}/g)||[]).length; if(n>0) set("C_UNIT",n); }
  }
  // 図面に書かれていない「※CB」「※盛土」等は0（=無し）として扱う（図面の下部に記載がある図面のみ）
  const hasNotes=/※/.test(all)&&/(新設|盛土|残土)/.test(all);
  if(hasNotes){ ["MORIDO","ZANDO","CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7"].forEach(k=>{ if(res.vals[k]===undefined){res.vals[k]=0;res.src[k]="text0";} }); }
  return res;
}

/* ================= 見積表の組み立て ================= */
function buildRows(S){
  const V=S.vals, g=k=>+V[k]||0;
  const cbSum=[1,2,3,4,5].reduce((a,i)=>a+g("CB"+i),0);
  const doma=rnd2(Math.max(0,g("S_AREA")-g("B_AREA")));
  const tsubo=rnd2(g("B_AREA")*0.3025), totalTsubo=rnd2(g("TOTAL_AREA")*0.3025);
  const fDeep=Math.trunc(g("F_DEEP_VAL")*10000);
  const m=new Date().getMonth()+1, isTemp=(m>=11||m<=3)||(m>=7&&m<=9);
  const R=(id,name,qty,unit,price,extra)=>Object.assign({id,name,qty,unit,price},extra||{});
  // 造成
  const z=[R("CB1","CB1段積み 厚120",g("CB1"),"m",PRICE.CB1),R("CB2","CB2段積み 厚120",g("CB2"),"m",PRICE.CB2),R("CB3","CB3段積み 厚120",g("CB3"),"m",PRICE.CB3),
    R("CB4","CB4段積み 厚150",g("CB4"),"m",PRICE.CB4),R("CB5","CB5段積み 厚150",g("CB5"),"m",PRICE.CB5),
    R("CP5","CP5段積み",g("CP5"),"m",PRICE.CP5),R("CP6","CP6段積み",g("CP6"),"m",PRICE.CP6),R("CP7","CP7段積み",g("CP7"),"m",PRICE.CP7)];
  if(TEST_LEGACY_RC){ z.push(R("NAGOYA","名古屋式擁壁 L=2m",S.rc.reduce((a,r)=>a+r.L,0),"m",200000)); }
  else {
    const hs=[...new Set([...RC_STD,...S.rc.map(r=>r.H)])].sort((a,b)=>a-b);
    hs.forEach(h=>{ const L=S.rc.filter(r=>r.H===h).reduce((a,r)=>a+r.L,0); const p=RC_PRICE[h]; z.push(R("RC"+h,"RC擁壁H"+h,rnd2(L),"m",p===undefined?0:p,{na:p===undefined&&L>0})); });
  }
  z.push(R("ZG","残土処分（良質土）",g("ZANDO"),"m3",PRICE.ZANDO_G),R("ZS","残土処分（産廃含む）",0,"m3",PRICE.ZANDO_S),
    R("SAI","砕石敷（RC40-0）",rnd2(cbSum*0.3),"㎡",PRICE.SAISEKI),R("MORI","盛土",g("MORIDO"),"㎥",PRICE.MORIDO),
    R("SEI","整地工",1,"式",PRICE.SEICHI),R("JUKI","重機回送費",1,"式",PRICE.JUKI),R("TEN","ブロック天端仕上げ",rnd2(cbSum),"m",PRICE.TENBA),R("EXP","現場諸経費（5%）",1,"式",0,{exp:1}));
  const gg=[R("MIZU","水盛遣方",1,"式",PRICE.GAI_MIZUMORI),R("JUKI","重機回送費",1,"式",PRICE.GAI_JUKI),R("TILE","ポーチタイル施工",1,"式",PRICE.TILE),R("HABA","基礎巾木仕上げ",1,"式",PRICE.HABAKI),
    R("DOMA","土間コンクリートt=100",doma,"㎡",PRICE.DOMA),R("DPUMP","土間ポンプ車",doma>0?1:0,"回",PRICE.DOMA_PUMP),
    R("KURUMA","車止め2セット/台",g("P_TOTAL"),"台",PRICE.KURUMA),R("LINE","駐車場ライン引き",g("P_TOTAL"),"台",PRICE.LINE),
    R("JISAKI","地先ブロック120面取り",g("JISAKI"),"m",PRICE.JISAKI),R("CYCLE","サイクルストッパー固定",g("C_UNIT"),"台",PRICE.CYCLE),
    R("GBOX","ゴミボックス組み立て",g("GOMI_BOX")>0?1:0,"台",PRICE.GOMIBOX),R("GAREA","ゴミ集積所 6段",g("GOMI_AREA")>0?1:0,"式",PRICE.GOMIAREA),
    R("SLIT","土間スリット部砕石敷き",rnd2(cbSum),"m",PRICE.SLIT),R("HAISUI","1階バルコニー・共用部 排水溝",4,"か所",PRICE.HAISUI),
    R("ENT","エントランスドア内モルタル金鏝",1,"式",PRICE.ENTMORTAR),R("KAIDAN","階段施工",g("STAIRS"),"段",PRICE.KAIDAN),R("EXP","現場諸経費（5%）",1,"式",0,{exp:1})];
  const k=[R("KISO","基礎本体工事（坪単価）",tsubo,"坪",PRICE.KISO_TSUBO),R("SUTE","スラブ下捨てコン",g("B_AREA"),"㎡",PRICE.SUTECON),R("UB","UB立上断熱材",1,"式",PRICE.UB),
    R("TEST","テストピース検査",2,"回",PRICE.TESTPIECE),R("PUMP","ポンプ車呼出費",2,"回",PRICE.PUMP_K),R("FUKA","深基礎増打ち工事",1,"式",fDeep),
    R("ONDO","温度補正費",isTemp?rnd2(g("B_AREA")*0.15):0,"㎥",isTemp?PRICE.ONDO:0),R("EXP","現場諸経費（5%）",1,"式",0,{exp:1})];

// 手入力の上書きを反映し、諸経費・金額を計算
function calc(S,key){
  const base=buildRows(S)[key], ov=(S.ov[key]||{});
  const rows=base.map(r=>{ const o=ov[r.id]||{}; const x={...r}; ["name","qty","unit","price"].forEach(f=>{ if(!r.exp&&o[f]!==undefined) x[f]=o[f]; }); x.ov=o; return x; });
  const sub=rows.filter(r=>!r.exp).reduce((a,r)=>a+r.qty*r.price,0);
  rows.forEach(r=>{ if(r.exp) r.price=Math.trunc(sub*EXP_RATE); r.amount=Math.trunc(r.qty*r.price); });
  const ex=rows.reduce((a,r)=>a+r.amount,0);
  return {rows,ex,inc:Math.trunc(ex*TAX_RATE)};
}

async function addFile(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  const S=newState(file.name.replace(/\.[^.]+$/,""),file.name,bytes,file.type||"application/pdf");
  if(/pdf/i.test(S.mime)||/\.pdf$/i.test(file.name)){
    S.mime="application/pdf";
    try{
      S.pdfDoc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
      applyExtract(S,await extractFromPdf(S.pdfDoc));
    }catch(e){ S.err="PDFを読み込めませんでした："+e.message; }
  } else { S.noText=true; S.imgUrl=URL.createObjectURL(file); applyExtract(S,{vals:{},src:{},raw:{RC:[]},noText:true}); }
  DB.push(S); CUR=DB.length-1; TAB="z"; render(); drawPdf();
}
async function drawPdf(){
  const S=DB[CUR]; const box=$("#pdfbox"); if(!S||!box||!S.pdfDoc||box.dataset.n===String(CUR)) return;

}

function modelRank(n){
  const pre=/preview|exp|latest/i.test(n)?1:0, fam=/flash/i.test(n)?(/lite/i.test(n)?2:0):(/pro/i.test(n)?1:3);
  const ver=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])||0;

}
async function modelCandidates(key){
  const fallback=["models/gemini-2.5-flash","models/gemini-2.5-pro","models/gemini-2.0-flash"];
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});

      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name).filter(n=>/gemini/i.test(n)&&!BAD_MODEL.test(n));

      if(names.length) return names; }
  }catch(e){}
  return fallback;
}

      if(r.ok){ const j=await r.json(); const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts.map(p=>p.text||"").join(""); if(t) return t; last=m+": 空の応答"; break; }
      const tx=(await r.text()).slice(0,200);
      if([400,404,429,500,503].includes(r.status)){ last=`${m}: HTTP ${r.status}`; errs.push(`${m.replace("models/","")} → ${r.status===429?"利用上限":r.status}`); if(r.status===429){quota++;await new Promise(r=>setTimeout(r,1500));} break; }
      throw new Error(`HTTP ${r.status}: ${tx}`);
    }
  }
  if(net&&!errs.length) throw new Error("📶 通信が不安定な可能性があります。電波の良い場所でもう一度お試しください（"+last+"）");
  if(quota&&quota===errs.length) throw new Error("Geminiの利用上限（無料枠の回数・容量）に達しています。数分〜翌日まで待つか、Google AI Studioで課金設定（有料プラン）をしてください。試したモデル："+errs.join("、"));
  throw new Error("すべてのモデルで失敗しました（"+errs.join("、")+"）");
}
function parseAI(text){
  const rt=text.split("###RESULT###").pop(), out={};
  ["S_AREA","B_AREA","TOTAL_AREA","ZANDO","P_TOTAL","C_UNIT","STAIRS","CB1","CB2","CB3","CB4","CB5","CP5","CP6","CP7","MORIDO","JISAKI","GOMI_BOX","GOMI_AREA","F_DEEP_VAL"].forEach(k=>{
    const m=rt.match(new RegExp(k+"[:：]\\s*([\\d.]+)")); if(m) out[k]=rnd2(parseFloat(m[1])); });
  return out;
}
function mergeAI(S,res){
  S.aiDiff=[];
  const lab=Object.fromEntries(FIELDS.map(f=>[f.k,f.l]));
  Object.keys(res).forEach(k=>{
    const cur=S.src[k], v=res[k]; if(cur==="man") return;               // 手入力は上書きしない
    if(AI_ALWAYS.includes(k)||cur==="none"||cur===undefined){ S.vals[k]=(k.startsWith("GOMI_"))?(v>0?1:0):v; S.src[k]="ai"; }
    else if(cur==="text"||cur==="text0"){ if(Math.abs((+S.vals[k]||0)-v)>0.005&&!k.startsWith("GOMI_")) S.aiDiff.push(`${lab[k]||k}：文字=${fmtQ(S.vals[k])} ／ AI=${fmtQ(v)}`); }
  });
}
async function runAI(){
  const S=DB[CUR], key=getKey();
  if(!key){ S.aiMsg="⚠️ AIのキーが未設定です。右上の「🔑 AIの設定」から入力してください（使わない場合は、手入力でも見積は出せます）。"; render(); return; }
  S.busy="AIが図面を読んでいます…（30秒〜1分ほどかかります）"; S.aiMsg=""; render();
  try{
    const t=await callGemini(key,S.bytes,S.mime,m=>{S.busy="🤖 "+m;const e=document.getElementById("aistat");if(e)e.textContent=S.busy;}); S.aiRaw=t; mergeAI(S,parseAI(t)); S.aiMsg="✅ AIの読み取りが終わりました。値を確認してください（「AI」と付いた項目）。";
  }catch(e){ S.aiMsg="⚠️ AIの読み取りに失敗しました："+e.message; }
  S.busy=""; render();
}
window.__APP={DB,calc,buildRows,parseItems,extractFromPdf,addFile,mergeAI,parseAI,get CUR(){return CUR;},setLegacy(v){/* 試験用 */}};
render();
</script>
